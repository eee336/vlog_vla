[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlog-vla"
version = "0.1.0"
description = "VLOG-VLA: persistent value-guided latent option graphs for StarVLA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "Pillow",
  "PyYAML",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
starvla = [
  "accelerate",
  "omegaconf",
  "transformers",
  "wandb",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["starVLA*", "scripts*", "deployment*", "tools*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
