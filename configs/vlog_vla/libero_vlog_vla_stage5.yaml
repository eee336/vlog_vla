method: VLOG-VLA
stage: 5
base_checkpoint: playground/Pretrained_models/StarVLA_Qwen3_VL_OFT_LIBERO_4in1
benchmark: libero
output_dir: outputs/vlog_stage5
seed: 7
vlog:
  enabled: true
  hidden_dim: 128
  state_dim: 8
  action_dim: 7
  action_horizon: 8
  num_tokens: 64
  num_options: 16
  option_dim: 128
  window_size: 16
  d_min: 2
  d_max: 8
  beta_threshold: 0.7
  q_switch_margin: 0.05
  commitment_cost: 0.25
  alpha_init: 0.0
training:
  freeze_backbone: true
  freeze_action_head: false
  option_lr: 1.0e-4
  critic_lr: 1.0e-4
  adapter_lr: 1.0e-4
  batch_size: 8
  train_steps: 12
  mixed_precision: false
  use_cuda: false
loss:
  lambda_action: 1.0
  lambda_router: 0.5
  lambda_q: 0.2
  lambda_switch: 0.01
  lambda_consistency: 0.02
  lambda_balance: 0.05
  alpha_cql: 0.1
  gamma: 0.99
  adv_temperature: 1.0
  adv_clip: 5.0
