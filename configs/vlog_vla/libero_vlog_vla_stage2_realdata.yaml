method: VLOG-VLA
stage: 2
base_checkpoint: playground/Pretrained_models/StarVLA_Qwen3_VL_OFT_LIBERO_4in1
benchmark: libero_spatial
output_dir: outputs/vlog_stage2_realdata
seed: 11
data:
  use_real_jsonl: true
  dataset_root: data/starvla_lerobot_standard_libero_spatial
  jsonl_path: data/starvla_lerobot_standard_libero_spatial/train.jsonl
  episode_mod: 128
  hidden_source: real_state_action_surrogate_until_vlm_hidden_adapter
vlog:
  enabled: true
  hidden_dim: 128
  state_dim: 8
  action_dim: 7
  action_horizon: 8
  num_tokens: 64
  num_options: 16
  option_dim: 128
  window_size: 10
  d_min: 2
  d_max: 8
  beta_threshold: 0.7
  q_switch_margin: 0.05
  commitment_cost: 0.25
  alpha_init: 0.0
training:
  freeze_backbone: true
  freeze_action_head: false
  use_action_head_lora: false
  option_lr: 1.0e-3
  critic_lr: 1.0e-4
  adapter_lr: 1.0e-4
  action_head_lr: 5.0e-5
  batch_size: 16
  train_steps: 200
  mixed_precision: false
  use_cuda: false
  synthetic_balanced_option_reports: false
  use_action_window_pseudo_options: true
loss:
  lambda_action: 1.0
  lambda_vq: 1.0
  lambda_distill: 1.0
  lambda_balance: 0.05
  lambda_consistency: 0.02
  lambda_switch: 0.01
  gamma: 0.99
  alpha_cql: 0.1
