method: VLOG-VLA
stage: 3
base_checkpoint: playground/Pretrained_models/StarVLA_Qwen3_VL_OFT_LIBERO_4in1
benchmark: libero_spatial
output_dir: outputs/vlog_real_stage3
seed: 11
data:
  train_jsonl: data/starvla_lerobot_standard_libero_spatial/train.jsonl
  max_samples: 512
  shuffle: false
vlog:
  enabled: true
  hidden_dim: 128
  state_dim: 8
  action_dim: 7
  action_horizon: 8
  num_tokens: 64
  num_options: 16
  option_dim: 128
  window_size: 10
  d_min: 2
  d_max: 8
  beta_threshold: 0.7
  q_switch_margin: 0.05
  commitment_cost: 0.25
  alpha_init: 0.0
training:
  freeze_backbone: true
  freeze_action_head: true
  option_lr: 1.0e-4
  batch_size: 16
  train_steps: 40
  synthetic_balanced_option_reports: false
  use_action_window_pseudo_options: true
  mixed_precision: false
  use_cuda: false
loss:
  lambda_transition: 1.0
  lambda_sparse: 0.01
  lambda_duration: 0.05
  lambda_balance: 0.2
  gamma: 0.99
  alpha_cql: 0.1
